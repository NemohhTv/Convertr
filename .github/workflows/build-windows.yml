name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Convertr.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Convertr app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertr-Windows-EXE
          path: dist/Convertr.exe
