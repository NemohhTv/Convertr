name: Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v2.2.0'
          }
          $version = $tag.TrimStart('v')
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "CONVERTR_VERSION=$version" >> $env:GITHUB_ENV
          "INSTALLER_NAME=Convertr-Setup-$tag.exe" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Convertr.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Convertr app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          iscc installer/Convertr.iss
          Rename-Item installer-output/Convertr-Setup.exe installer-output/$env:INSTALLER_NAME

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Convertr ${{ env.RELEASE_TAG }}
          files: installer-output/${{ env.INSTALLER_NAME }}
          generate_release_notes: true
