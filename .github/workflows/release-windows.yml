name: Release Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $tag = 'v2.2.1'
          $version = '2.2.1'
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "CONVERTR_VERSION=$version" >> $env:GITHUB_ENV
          "INSTALLER_NAME=Convertr-Setup-$tag.exe" >> $env:GITHUB_ENV
          "FFMPEG_INSTALLER_NAME=Convertr-FFmpeg-Setup-$tag.exe" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Convertr app EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Convertr app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Convertr installer
        shell: pwsh
        run: |
          iscc installer/Convertr.iss
          Rename-Item installer-output/Convertr-Setup.exe installer-output/$env:INSTALLER_NAME

      - name: Build FFmpeg installer
        shell: pwsh
        run: |
          iscc installer/FFmpegInstaller.iss
          Rename-Item installer-output/Convertr-FFmpeg-Setup.exe installer-output/$env:FFMPEG_INSTALLER_NAME

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag 2>$null
          gh release create $env:RELEASE_TAG "installer-output/$env:INSTALLER_NAME" "installer-output/$env:FFMPEG_INSTALLER_NAME" --title "Convertr $env:RELEASE_TAG" --notes "Windows installers for Convertr $env:RELEASE_TAG. Download Convertr-Setup first, then run the FFmpeg setup if Convertr needs FFmpeg installed locally."
