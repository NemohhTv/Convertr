name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Convertr.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Convertr app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $env:CONVERTR_VERSION = $version
          iscc installer/Convertr.iss
          Rename-Item installer-output/Convertr-Setup.exe Convertr-Setup-${{ github.ref_name }}.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/Convertr-Setup-${{ github.ref_name }}.exe
          generate_release_notes: true
